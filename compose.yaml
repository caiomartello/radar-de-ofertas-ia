services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env.local
    environment:
      DATABASE_PATH: /app/data/radar.sqlite
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - radar-data:/app/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  radar-data:
